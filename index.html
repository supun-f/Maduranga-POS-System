<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maduranga POS</title>
<style>
/* ============================================================
   NOVAPOS — self-contained utility CSS (Tailwind-equivalent)
   Written by hand so the app has zero external dependencies and
   works with the network fully disconnected, forever.
   ============================================================ */
:root{
  --bg:#0b1220; --bg-soft:#0f1a2e; --surface:#111d33; --surface-2:#16233d;
  --card: rgba(255,255,255,0.04); --card-border: rgba(255,255,255,0.08);
  --text:#eaf0fb; --text-dim:#93a2c2; --text-faint:#5c6b8a;
  --accent:#2563eb; --accent-2:#38bdf8; --accent-soft: rgba(37,99,235,0.18);
  --good:#22c55e; --warn:#f59e0b; --bad:#ef4444;
  --radius:16px; --radius-sm:10px; --radius-lg:24px;
  --font: -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  --mono: "SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
}
[data-theme="light"]{
  --bg:#eef1f8; --bg-soft:#f7f9fd; --surface:#ffffff; --surface-2:#f3f5fb;
  --card: rgba(15,23,42,0.03); --card-border: rgba(15,23,42,0.09);
  --text:#0f172a; --text-dim:#4b5878; --text-faint:#8895b3;
  --accent:#2563eb; --accent-2:#0ea5e9; --accent-soft: rgba(37,99,235,0.10);
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  font-family:var(--font); background:
    radial-gradient(1200px 600px at 90% -10%, var(--accent-soft), transparent 60%),
    var(--bg);
  color:var(--text); min-height:100vh; -webkit-font-smoothing:antialiased;
  transition:background .3s,color .3s;
}
::selection{background:var(--accent); color:#fff;}
::-webkit-scrollbar{width:10px; height:10px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--card-border); border-radius:10px;}
a{color:inherit; text-decoration:none;}
button{font-family:inherit; cursor:pointer;}
input,select,textarea{font-family:inherit; color:var(--text); background:transparent;}
input::placeholder,textarea::placeholder{color:var(--text-faint);}
:focus-visible{outline:2px solid var(--accent-2); outline-offset:2px;}
img{max-width:100%; display:block;}

/* layout */
.app{display:flex; min-height:100vh;}
.sidebar{
  width:236px; flex-shrink:0; background:var(--surface); border-right:1px solid var(--card-border);
  display:flex; flex-direction:column; position:sticky; top:0; height:100vh; z-index:40;
  transition:transform .25s ease;
}
.main{flex:1; min-width:0; display:flex; flex-direction:column;}
.topbar{
  display:flex; align-items:center; justify-content:space-between; gap:16px;
  padding:16px 28px; border-bottom:1px solid var(--card-border); background:var(--bg-soft);
  position:sticky; top:0; z-index:30; backdrop-filter:blur(10px);
}
.content{padding:28px; flex:1;}
@media (max-width:980px){
  .sidebar{position:fixed; left:0; transform:translateX(-100%); box-shadow:0 0 40px rgba(0,0,0,.4);}
  .sidebar.open{transform:translateX(0);}
  .content{padding:16px;}
  .topbar{padding:12px 16px;}
}

/* utility-ish classes */
.flex{display:flex;} .grid{display:grid;} .hidden{display:none !important;}
.items-center{align-items:center;} .items-start{align-items:flex-start;} .items-end{align-items:flex-end;}
.justify-between{justify-content:space-between;} .justify-center{justify-content:center;} .justify-end{justify-content:flex-end;}
.flex-col{flex-direction:column;} .flex-wrap{flex-wrap:wrap;}
.gap-1{gap:4px;} .gap-2{gap:8px;} .gap-3{gap:12px;} .gap-4{gap:16px;} .gap-5{gap:20px;} .gap-6{gap:24px;}
.w-full{width:100%;} .h-full{height:100%;} .flex-1{flex:1;} .relative{position:relative;} .overflow-auto{overflow:auto;}
.text-center{text-align:center;} .text-right{text-align:right;}
.rounded{border-radius:var(--radius);} .rounded-sm{border-radius:var(--radius-sm);} .rounded-lg{border-radius:var(--radius-lg);} .rounded-full{border-radius:999px;}
.mono{font-family:var(--mono);}
.p-0{padding:0;} .mt-1{margin-top:4px;} .mt-2{margin-top:8px;} .mt-3{margin-top:12px;} .mt-4{margin-top:16px;} .mt-6{margin-top:24px;}
.mb-1{margin-bottom:4px;} .mb-2{margin-bottom:8px;} .mb-3{margin-bottom:12px;} .mb-4{margin-bottom:16px;}

.text-dim{color:var(--text-dim);} .text-faint{color:var(--text-faint);}
.text-good{color:var(--good);} .text-warn{color:var(--warn);} .text-bad{color:var(--bad);} .text-accent{color:var(--accent-2);}
.fs-11{font-size:11px;} .fs-12{font-size:12px;} .fs-13{font-size:13px;} .fs-14{font-size:14px;}
.fs-16{font-size:16px;} .fs-18{font-size:18px;} .fs-22{font-size:22px;} .fs-28{font-size:28px;} .fs-34{font-size:34px;}
.fw-400{font-weight:400;} .fw-500{font-weight:500;} .fw-600{font-weight:600;} .fw-700{font-weight:700;}
.uppercase{text-transform:uppercase;} .tracking{letter-spacing:.06em;}

.card{
  background:var(--card); border:1px solid var(--card-border); border-radius:var(--radius);
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
}
.card-pad{padding:20px;}
.surface{background:var(--surface); border:1px solid var(--card-border); border-radius:var(--radius);}

.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  padding:10px 16px; border-radius:var(--radius-sm); border:1px solid var(--card-border);
  background:var(--surface-2); color:var(--text); font-size:14px; font-weight:500;
  transition:all .15s ease; white-space:nowrap;
}
.btn:hover{border-color:var(--accent-2); transform:translateY(-1px);}
.btn:active{transform:translateY(0);}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent-2)); border-color:transparent; color:#fff;}
.btn-primary:hover{filter:brightness(1.08); box-shadow:0 8px 24px -8px var(--accent);}
.btn-ghost{background:transparent; border-color:transparent;}
.btn-ghost:hover{background:var(--card); border-color:var(--card-border);}
.btn-danger{background:transparent; border-color:rgba(239,68,68,.35); color:var(--bad);}
.btn-danger:hover{background:rgba(239,68,68,.1); border-color:var(--bad);}
.btn-sm{padding:6px 10px; font-size:13px; border-radius:8px;}
.btn-icon{padding:9px; width:38px; height:38px;}
.btn:disabled{opacity:.4; cursor:not-allowed; transform:none;}

.input, select.input, textarea.input{
  width:100%; padding:10px 12px; border-radius:var(--radius-sm); border:1px solid var(--card-border);
  background:var(--surface-2); font-size:14px; transition:border-color .15s;
}
.input:focus{border-color:var(--accent-2);}
.label{font-size:12px; color:var(--text-dim); font-weight:500; margin-bottom:6px; display:block;}
.field{margin-bottom:14px;}

.badge{display:inline-flex; align-items:center; gap:4px; padding:3px 9px; border-radius:999px; font-size:11px; font-weight:600;}
.badge-good{background:rgba(34,197,94,.14); color:var(--good);}
.badge-warn{background:rgba(245,158,11,.14); color:var(--warn);}
.badge-bad{background:rgba(239,68,68,.14); color:var(--bad);}
.badge-accent{background:var(--accent-soft); color:var(--accent-2);}

table{width:100%; border-collapse:collapse; font-size:14px;}
th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-faint); font-weight:600; padding:10px 12px; border-bottom:1px solid var(--card-border);}
td{padding:12px; border-bottom:1px solid var(--card-border); vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tbody tr{transition:background .15s;}
tbody tr:hover{background:var(--card);}

.grid-2{grid-template-columns:1fr 1fr;} .grid-3{grid-template-columns:repeat(3,1fr);}
.grid-4{grid-template-columns:repeat(4,1fr);} .grid-5{grid-template-columns:repeat(5,1fr);}
.grid-6{grid-template-columns:repeat(6,1fr);}
@media (max-width:1100px){ .grid-4{grid-template-columns:repeat(2,1fr);} .grid-6{grid-template-columns:repeat(3,1fr);} .grid-5{grid-template-columns:repeat(3,1fr);} }
@media (max-width:640px){ .grid-2,.grid-3,.grid-4,.grid-5,.grid-6{grid-template-columns:repeat(2,1fr);} }

.nav-item{
  display:flex; align-items:center; gap:12px; padding:11px 16px; border-radius:var(--radius-sm);
  color:var(--text-dim); font-size:14px; font-weight:500; transition:all .15s; margin:2px 12px;
}
.nav-item:hover{background:var(--card); color:var(--text);}
.nav-item.active{background:linear-gradient(135deg,var(--accent),var(--accent-2)); color:#fff;}
.nav-icon{width:20px; height:20px; flex-shrink:0; display:flex; align-items:center; justify-content:center;}

.modal-overlay{
  position:fixed; inset:0; background:rgba(2,6,15,.6); backdrop-filter:blur(4px);
  display:flex; align-items:center; justify-content:center; z-index:100; padding:20px;
  animation:fadeIn .15s ease;
}
.modal{
  background:var(--surface); border:1px solid var(--card-border); border-radius:var(--radius-lg);
  max-width:560px; width:100%; max-height:90vh; overflow:auto; animation:slideUp .2s ease;
  box-shadow:0 30px 80px -20px rgba(0,0,0,.5);
}
.modal-wide{max-width:820px;}
@keyframes fadeIn{from{opacity:0} to{opacity:1}}
@keyframes slideUp{from{opacity:0; transform:translateY(16px) scale(.98)} to{opacity:1; transform:translateY(0) scale(1)}}
.modal-header{display:flex; align-items:center; justify-content:between; justify-content:space-between; padding:20px 22px; border-bottom:1px solid var(--card-border);}
.modal-body{padding:22px;}
.modal-footer{padding:16px 22px; border-top:1px solid var(--card-border); display:flex; justify-content:flex-end; gap:10px;}

.toast-wrap{position:fixed; bottom:24px; right:24px; z-index:200; display:flex; flex-direction:column; gap:10px;}
.toast{
  background:var(--surface); border:1px solid var(--card-border); border-radius:12px; padding:13px 18px;
  min-width:260px; box-shadow:0 12px 32px -8px rgba(0,0,0,.4); display:flex; align-items:center; gap:10px;
  animation:toastIn .2s ease;
}
@keyframes toastIn{from{opacity:0; transform:translateX(30px)} to{opacity:1; transform:translateX(0)}}
.toast-dot{width:8px; height:8px; border-radius:999px; flex-shrink:0;}

.divider{height:1px; background:var(--card-border); border:none; margin:16px 0;}
.pill-tab{padding:8px 14px; border-radius:999px; font-size:13px; font-weight:500; color:var(--text-dim); border:1px solid transparent;}
.pill-tab.active{background:var(--accent-soft); color:var(--accent-2); border-color:rgba(56,189,248,.3);}

.product-tile{
  background:var(--card); border:1px solid var(--card-border); border-radius:var(--radius);
  padding:14px; cursor:pointer; transition:all .15s; display:flex; flex-direction:column; gap:8px; text-align:left;
}
.product-tile:hover{border-color:var(--accent-2); transform:translateY(-2px);}
.product-tile:disabled{opacity:.35; cursor:not-allowed; transform:none;}
.product-thumb{
  width:100%; aspect-ratio:1.4; border-radius:10px; background:var(--surface-2);
  display:flex; align-items:center; justify-content:center; overflow:hidden; color:var(--text-faint); font-size:11px;
}
.product-thumb img{width:100%; height:100%; object-fit:cover;}

.stat-card{padding:20px; display:flex; flex-direction:column; gap:6px;}
.stat-icon{width:38px; height:38px; border-radius:10px; display:flex; align-items:center; justify-content:center; margin-bottom:6px;}

.kbd{background:var(--surface-2); border:1px solid var(--card-border); border-radius:6px; padding:1px 6px; font-size:11px; font-family:var(--mono);}
.empty{padding:50px 20px; text-align:center; color:var(--text-faint);}
.switch{position:relative; width:42px; height:24px; border-radius:999px; background:var(--surface-2); border:1px solid var(--card-border); flex-shrink:0;}
.switch::after{content:''; position:absolute; width:18px; height:18px; border-radius:999px; background:var(--text-faint); top:2px; left:2px; transition:all .2s;}
.switch.on{background:var(--accent);}
.switch.on::after{left:20px; background:#fff;}

.receipt{width:320px; background:#fff; color:#0a0a0a; padding:18px; font-family:var(--mono); font-size:12px; margin:0 auto;}
.receipt hr{border:none; border-top:1px dashed #999; margin:8px 0;}
.receipt .rline{display:flex; justify-content:space-between; gap:8px;}
.receipt-80{width:320px;} .receipt-58{width:230px;} .receipt-a4{width:100%; max-width:560px; font-family:var(--font);}

@media print{
  body *{visibility:hidden;}
  #printArea, #printArea *{visibility:visible;}
  #printArea{position:absolute; top:0; left:0; width:100%;}
}
.scale-tap{transition:transform .1s;} .scale-tap:active{transform:scale(.96);}
</style>

<body data-theme="dark">
<div id="app" class="app"></div>
<div id="printArea" class="hidden"></div>
<div class="toast-wrap" id="toastWrap"></div>

<script>
/* ============================================================
   NOVAPOS — Offline Point of Sale
   Vanilla ES6+, zero dependencies, zero network calls.
   All persistence via localStorage.
   ============================================================ */

/* ---------------------------------------------------------
   1. STORAGE LAYER
--------------------------------------------------------- */
const DB = {
  keys:{
    settings:'novapos_settings', products:'novapos_products', categories:'novapos_categories',
    sales:'novapos_sales', invoiceCounter:'novapos_invoiceCounter', theme:'novapos_theme', grns:'novapos_grns',
    cashiers:'novapos_cashiers'
  },
  get(key, fallback){
    try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
    catch(e){ return fallback; }
  },
  set(key, val){ localStorage.setItem(key, JSON.stringify(val)); }
};

function uid(prefix=''){ return prefix + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function fmtMoney(n){
  const s = state.settings;
  const v = (Math.round((Number(n)||0) * 100) / 100).toFixed(2);
  return `${s.currency}${Number(v).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}`;
}
function fmtDate(ts){ const d=new Date(ts); return d.toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'}); }
function fmtTime(ts){ const d=new Date(ts); return d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'}); }
function fmtDateTime(ts){ return fmtDate(ts)+' · '+fmtTime(ts); }
function todayKey(ts=Date.now()){ const d=new Date(ts); return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`; }
function escapeHtml(str){ return String(str==null?'':str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

/* ---------------------------------------------------------
   2. DEFAULT / SEED DATA
--------------------------------------------------------- */
const DEFAULT_SETTINGS = {
  companyName:'Your Company', logo:'', address:'123 Market Street, Springfield', phone:'+1 (555) 010-2030',
  currency:'$', taxPercent:0, footer:'Thank you for your business!', themeColor:'#2563eb',
  theme:'dark', invoicePrefix:'INV-', invoiceCounter:1001, receiptSize:'80mm', cashierName:'Cashier',
  grnPrefix:'GRN-', grnCounter:1001,
  trialDays:14, /* 0 or blank = trial disabled (unlimited use) */
  password:'', /* business Admin password, empty = login disabled */
  ownerPassword:'', /* optional higher tier — protects trial/remote-lock/billing controls from Admin. Blank = owner tier off, Admin sees everything (old behavior) */
  staffPassword:'', /* optional cashier password, POS-only access */
  staffPermissions:{ dashboard:false, products:false, history:false, reports:false, grn:false, cancelSale:false } /* pos is always allowed; settings & backup are never allowed for cashiers */,
  cashierManuallyDisabled:false, /* kill switch — blocks cashier login instantly */
  adminManuallyDisabled:false, /* owner-only kill switch — blocks admin login instantly */
  billingCycleDays:30, /* 0 = disabled; cashier login auto-blocks if overdue (admin login is never affected) */
  lastPaymentDate: Date.now()
};
const DEFAULT_CATEGORIES = ['Beverages','Snacks','Bakery','Grocery','Household'];
function seedProducts(){
  const cats = DEFAULT_CATEGORIES;
  const items = [
    ['Sparkling Water 500ml','Beverages',1.20,2.50,120,10],
    ['Espresso Beans 250g','Beverages',5.00,9.99,40,5],
    ['Potato Chips Classic','Snacks',0.80,1.99,80,10],
    ['Chocolate Cookies','Snacks',1.10,2.49,60,8],
    ['Sourdough Loaf','Bakery',1.50,3.75,25,5],
    ['Croissant','Bakery',0.60,1.80,35,6],
    ['Basmati Rice 1kg','Grocery',2.20,4.50,50,8],
    ['Olive Oil 500ml','Grocery',3.80,7.99,30,5],
    ['Paper Towels 2pk','Household',1.90,3.99,45,6],
    ['Dish Soap 750ml','Household',1.30,2.99,55,6]
  ];
  return items.map(([name,cat,buy,sell,stock,low])=>({
    id:uid('p_'), name, category:cat, sku:'SKU'+Math.floor(1000+Math.random()*9000),
    barcode: String(Math.floor(1000000000000+Math.random()*8999999999999)),
    buyPrice:buy, sellPrice:sell, stock, lowStock:low, image:''
  }));
}

/* ---------------------------------------------------------
   3. STATE
--------------------------------------------------------- */
const state = {
  settings: DB.get(DB.keys.settings, DEFAULT_SETTINGS),
  products: DB.get(DB.keys.products, null),
  categories: DB.get(DB.keys.categories, null),
  sales: DB.get(DB.keys.sales, []),
  grns: DB.get(DB.keys.grns, []),
  cashiers: DB.get(DB.keys.cashiers, null),
  route: 'dashboard',
  cart: [],
  cartDiscount: 0,
  cartDiscountType: 'amount', // amount | percent
  cashReceived: '',
  paymentMethod: 'cash', // cash | card
  productSearch: '',
  productCategoryFilter: 'All',
  reprintSale: null,
  editingProduct: null,
  editingCashier: null,
  sidebarOpen: false,
  authenticated: sessionStorage.getItem('novapos_auth') === '1',
  role: sessionStorage.getItem('novapos_role') || 'admin', // admin | staff
  currentCashierId: sessionStorage.getItem('novapos_cashierid') || null,
  currentCashierName: sessionStorage.getItem('novapos_cashiername') || '',
  loginRole: null, // which tab is selected on the login screen
  skipAdminSetup: false,
  loginError: '',
  grnCart: [], grnSupplier: '', grnNotes: '', grnSearch: '', grnHistorySearch: '',
};
if(state.products === null){ state.products = seedProducts(); DB.set(DB.keys.products, state.products); }
if(state.categories === null){ state.categories = DEFAULT_CATEGORIES.slice(); DB.set(DB.keys.categories, state.categories); }
if(state.settings.password === undefined) state.settings.password = '';
if(state.settings.staffPassword === undefined) state.settings.staffPassword = '';
if(state.settings.ownerPassword === undefined) state.settings.ownerPassword = '';
if(state.settings.adminManuallyDisabled === undefined) state.settings.adminManuallyDisabled = false;
if(!state.settings.staffPermissions) state.settings.staffPermissions = { dashboard:false, products:false, history:false, reports:false, grn:false };
if(state.settings.staffPermissions.grn === undefined) state.settings.staffPermissions.grn = false;
if(state.settings.staffPermissions.cancelSale === undefined) state.settings.staffPermissions.cancelSale = false;
if(state.settings.cashierManuallyDisabled === undefined) state.settings.cashierManuallyDisabled = false;
if(state.settings.billingCycleDays === undefined) state.settings.billingCycleDays = 30;
if(state.settings.lastPaymentDate === undefined) state.settings.lastPaymentDate = Date.now();
if(state.settings.grnPrefix === undefined) state.settings.grnPrefix = 'GRN-';
if(state.settings.grnCounter === undefined) state.settings.grnCounter = 1001;
if(state.settings.trialDays === undefined) state.settings.trialDays = 14;
if(state.cashiers === null){
  // one-time migration from the old single shared cashier password
  state.cashiers = state.settings.staffPassword
    ? [{id: uid('c_'), name: state.settings.cashierName || 'Cashier', password: state.settings.staffPassword, enabled: true}]
    : [];
  DB.set(DB.keys.cashiers, state.cashiers);
}
document.body.setAttribute('data-theme', state.settings.theme || 'dark');
document.documentElement.style.setProperty('--accent', state.settings.themeColor || '#2563eb');

/* ---------------------------------------------------------
   3b. TRIAL / LICENSE LOCK
   Fully offline license gate: each browser install gets a random
   Install ID (stored in localStorage, never changes). Once the
   configured trial period elapses, the app locks and asks for an
   unlock code. The unlock code is a deterministic hash of the
   Install ID + a secret string — CHANGE THE SECRET BELOW before
   distributing copies, and keep it private.
   To generate a code for a buyer: open any copy of this app (e.g.
   your own), press F12 to open the console, and run:
     computeUnlockCode("THEIR-INSTALL-ID")
--------------------------------------------------------- */
const LICENSE_SECRET = 'NOVAPOS-2026-CHANGE-ME'; // <-- change before distributing copies
function getOrCreateInstallId(){
  let id = localStorage.getItem('novapos_installid');
  if(!id){ id = uid('DEV-').toUpperCase(); localStorage.setItem('novapos_installid', id); }
  return id;
}
function getTrialStart(){
  let t = localStorage.getItem('novapos_trialstart');
  if(!t){ t = String(Date.now()); localStorage.setItem('novapos_trialstart', t); }
  return Number(t);
}
function isTrialUnlocked(){ return localStorage.getItem('novapos_trialunlocked') === '1'; }
function computeUnlockCode(installId){
  const str = String(installId) + '|' + LICENSE_SECRET;
  let hash = 0;
  for(let i=0;i<str.length;i++){ hash = ((hash<<5)-hash + str.charCodeAt(i)) | 0; }
  let code = Math.abs(hash).toString(36).toUpperCase();
  while(code.length < 8) code = '0'+code;
  return code.slice(0,8);
}
function trialDaysLeft(){
  const days = Number(state.settings.trialDays) || 0;
  if(days <= 0) return Infinity; // trial disabled
  const elapsed = (Date.now() - getTrialStart()) / 86400000;
  return Math.ceil(days - elapsed);
}
function isTrialExpired(){ return trialDaysLeft() <= 0 && !isTrialUnlocked(); }

/* ---------------------------------------------------------
   3c. CASHIER BILLING CYCLE (admin-controlled monthly gate)
   Only affects the cashier login — the admin account is never
   blocked by this. Admin can flip a manual kill switch, or let it
   auto-lock when billingCycleDays have passed since lastPaymentDate.
--------------------------------------------------------- */
function cashierDaysLeft(){
  const s = state.settings;
  const cycle = Number(s.billingCycleDays) || 0;
  if(cycle <= 0) return Infinity; // auto-lock disabled
  const elapsed = (Date.now() - (Number(s.lastPaymentDate) || Date.now())) / 86400000;
  return Math.ceil(cycle - elapsed);
}
function isCashierAccessBlocked(){
  const s = state.settings;
  if(s.cashierManuallyDisabled) return true;
  return cashierDaysLeft() <= 0;
}

/* ---------------------------------------------------------
   3d. ONLINE REMOTE DISABLE (owner-controlled kill switch)
   Periodically checks a JSON file you control (a public GitHub
   file listing blocked Install IDs). If this install's ID is in
   that list, the app locks completely. Works offline using a
   cached result — REMOTE_GRACE_DAYS controls how long it will run
   without successfully re-checking before it locks and asks to
   reconnect. To cut someone off: add their Install ID to the JSON
   array at REMOTE_CHECK_URL and commit — no code changes needed.
--------------------------------------------------------- */
const REMOTE_CHECK_URL = 'https://raw.githubusercontent.com/supun-f/Maduranga-POS-System/refs/heads/main/blocked.json';
const REMOTE_CHECK_INTERVAL_DAYS = 3;
const REMOTE_GRACE_DAYS = 10;
function getLastRemoteCheck(){
  let t = localStorage.getItem('novapos_lastcheck');
  if(!t){ t = String(Date.now()); localStorage.setItem('novapos_lastcheck', t); }
  return Number(t);
}
function isRemotelyBlocked(){ return localStorage.getItem('novapos_remoteblocked') === '1'; }
function isRemoteGraceExpired(){ return (Date.now() - getLastRemoteCheck()) / 86400000 > REMOTE_GRACE_DAYS; }
async function checkRemoteLicense(force){
  if(!REMOTE_CHECK_URL) return;
  if(!force && (Date.now() - getLastRemoteCheck()) / 86400000 < REMOTE_CHECK_INTERVAL_DAYS) return;
  try{
    const res = await fetch(REMOTE_CHECK_URL + (REMOTE_CHECK_URL.includes('?')?'&':'?') + 't=' + Date.now(), {cache:'no-store'});
    if(!res.ok) throw new Error('bad response');
    const list = await res.json();
    const installId = getOrCreateInstallId();
    const blocked = Array.isArray(list) && list.includes(installId);
    const wasBlocked = isRemotelyBlocked();
    localStorage.setItem('novapos_remoteblocked', blocked ? '1' : '0');
    localStorage.setItem('novapos_lastcheck', String(Date.now()));
    if(blocked !== wasBlocked) render();
  } catch(e){
    // offline or fetch failed — silently rely on cached status / grace period
  }
}

    if(b.disabled) return;
    state.loginRole = b.getAttribute('data-loginrole'); state.loginError=''; renderLogin();
  }));
  const logoTrigger = document.getElementById('loginLogoTrigger');
  if(logoTrigger && !isOwnerMode && s.ownerPassword){

      clickCount++;

  const tryLogin = ()=>{
    const val = document.getElementById('loginPassword').value;
    if(state.loginRole==='owner'){
      if(!s.ownerPassword || val !== s.ownerPassword){ state.loginError = 'Incorrect password'; renderLogin(); return; }

      sessionStorage.removeItem('novapos_cashierid'); sessionStorage.removeItem('novapos_cashiername');
      render(); return;
    }
    if(state.loginRole==='admin'){
      if(!s.password || val !== s.password){ state.loginError = 'Incorrect password'; renderLogin(); return; }
      if(s.adminManuallyDisabled){ state.loginError = 'Admin access is suspended — contact owner'; renderLogin(); return; }
      state.authenticated = true; state.role = 'admin'; state.loginError=''; state.currentCashierId=null; state.currentCashierName='';
      sessionStorage.setItem('novapos_auth','1'); sessionStorage.setItem('novapos_role','admin');
      sessionStorage.removeItem('novapos_cashierid'); sessionStorage.removeItem('novapos_cashiername');
      render(); return;
    }
    // staff / cashier
    const match = state.cashiers.find(c=>c.enabled && c.password===val);
    if(!match){ state.loginError = 'Incorrect password'; renderLogin(); return; }
    if(isCashierAccessBlocked()){ state.loginError = 'Cashier access is suspended — contact admin'; renderLogin(); return; }
    state.authenticated = true; state.role = 'staff'; state.loginError=''; state.route='pos';
    state.currentCashierId = match.id; state.currentCashierName = match.name;
    sessionStorage.setItem('novapos_auth','1'); sessionStorage.setItem('novapos_role','staff');
    sessionStorage.setItem('novapos_cashierid', match.id); sessionStorage.setItem('novapos_cashiername', match.name);
    render();
  };
  document.getElementById('loginBtn').addEventListener('click', tryLogin);
  document.getElementById('loginPassword').addEventListener('keydown', e=>{ if(e.key==='Enter') tryLogin(); });
}

  const sp = state.settings.staffPermissions || {};
  return ['pos', ...Object.keys(sp).filter(k=>sp[k])];

function render(){
  if(isRemotelyBlocked()){ renderRemoteBlocked(); return; }
  if(isRemoteGraceExpired()){ renderNeedsInternet(); return; }
  if(isTrialExpired()){ renderTrialLock(); return; }
  if(state.role==='staff' && state.authenticated && isCashierAccessBlocked()){
    state.authenticated = false; state.loginRole = 'staff'; state.currentCashierId=null; state.currentCashierName='';
    state.loginError = 'Cashier access is suspended — contact admin';
    sessionStorage.removeItem('novapos_auth'); sessionStorage.removeItem('novapos_role');
    sessionStorage.removeItem('novapos_cashierid'); sessionStorage.removeItem('novapos_cashiername');
    renderLogin(); return;
  }
  if(state.role==='admin' && state.authenticated && state.settings.adminManuallyDisabled){
    state.authenticated = false; state.loginRole = 'admin';
    state.loginError = 'Admin access is suspended — contact owner';
    sessionStorage.removeItem('novapos_auth'); sessionStorage.removeItem('novapos_role');
    renderLogin(); return;
  }
  if(!state.settings.password && !state.skipAdminSetup){ renderCreateAdmin(); return; }
  if((state.settings.password || state.cashiers.some(c=>c.enabled)) && !state.authenticated){ renderLogin(); return; }
  if(state.role==='staff' && !allowedStaffRoutes().includes(state.route)){ state.route='pos'; }
  const s = state.settings;
  const navItems = state.role==='staff' ? NAV.filter(n=>allowedStaffRoutes().includes(n.id)) : NAV;
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="sidebar ${state.sidebarOpen?'open':''}" id="sidebar">
      <div class="flex items-center gap-3" style="padding:22px 20px 18px;">
        ${brandMark(36)}

        </div>
      </div>
      <div style="flex:1; overflow:auto; padding:6px 0;">
        ${navItems.map(n=>`
          <a class="nav-item ${state.route===n.id?'active':''}" data-route="${n.id}" href="#">
            <span class="nav-icon">${icon(n.icon)}</span><span>${n.label}</span>
          </a>`).join('')}
      </div>
      <div style="padding:16px 20px; border-top:1px solid var(--card-border);">
        <div class="flex items-center justify-between">
          <span class="fs-12 text-dim">Theme</span>
          <button id="themeToggle" class="btn btn-ghost btn-icon" title="Toggle theme">${icon(s.theme==='dark'?'moon':'sun')}</button>

      </div>
    </div>
    <div class="main">
      <div class="topbar">
        <div class="flex items-center gap-3">
          <button class="btn btn-ghost btn-icon" id="menuBtn" style="display:none;">${icon('menu')}</button>
          <div>
            <div class="fs-18 fw-600">${NAV.find(n=>n.id===state.route)?.label || ''}</div>
            <div class="fs-12 text-faint">${fmtDateTime(Date.now())}</div>
          </div>

        <div class="flex items-center gap-2">
          ${state.role!=='staff' ? `<button class="btn btn-primary btn-sm" data-route="pos">${icon('plus')} New Sale</button>` : ''}
        </div>
      </div>
      <div class="content" id="pageContent"></div>
    </div>
  `;
  document.querySelectorAll('[data-route]').forEach(el=>{
    el.addEventListener('click', e=>{ e.preventDefault(); state.route = el.getAttribute('data-route'); state.sidebarOpen=false; render(); });
  });
  document.getElementById('themeToggle').addEventListener('click', ()=>{
    state.settings.theme = state.settings.theme==='dark' ? 'light' : 'dark';
    document.body.setAttribute('data-theme', state.settings.theme);
    persist('settings'); render();
  });
  const menuBtn = document.getElementById('menuBtn');
  if(window.innerWidth<=980){ menuBtn.style.display='inline-flex'; }
  menuBtn.addEventListener('click', ()=>{ state.sidebarOpen = !state.sidebarOpen; render(); });
  const logoutBtn = document.getElementById('logoutBtn');
  if(logoutBtn) logoutBtn.addEventListener('click', ()=>{
    state.authenticated = false; state.role='admin'; state.loginRole=null;
    state.currentCashierId=null; state.currentCashierName='';
    sessionStorage.removeItem('novapos_auth'); sessionStorage.removeItem('novapos_role');
    sessionStorage.removeItem('novapos_cashierid'); sessionStorage.removeItem('novapos_cashiername');
    render();
  });

  renderPage();
}

function renderPage(){
  if(state.role==='staff' && !allowedStaffRoutes().includes(state.route)){ state.route='pos'; }
  const el = document.getElementById('pageContent');
  const active = document.activeElement;
  const activeId = (active && el.contains(active)) ? active.id : null;
  let selStart = null, selEnd = null;
  if(activeId){ try{ selStart = active.selectionStart; selEnd = active.selectionEnd; }catch(e){} }

  if(state.route==='dashboard') el.innerHTML = pageDashboard();
  else if(state.route==='pos') el.innerHTML = pagePOS();
  else if(state.route==='products') el.innerHTML = pageProducts();
  else if(state.route==='grn') el.innerHTML = pageGRN();
  else if(state.route==='history') el.innerHTML = pageHistory();
  else if(state.route==='reports') el.innerHTML = pageReports();
  else if(state.route==='backup') el.innerHTML = pageBackup();
  else if(state.route==='settings') el.innerHTML = pageSettings();
  bindPageEvents();

  if(activeId){
    const revived = document.getElementById(activeId);
    if(revived){
      revived.focus();
      if(selStart !== null){ try{ revived.setSelectionRange(selStart, selEnd); }catch(e){} }
    }
  }
}

/* ---------------------------------------------------------
   7. DASHBOARD
--------------------------------------------------------- */
function pageDashboard(){
  const now = Date.now();
  const todaySales = state.sales.filter(s=> todayKey(s.date)===todayKey(now));
  const monthSales = state.sales.filter(s=>{ const d=new Date(s.date), n=new Date(now); return d.getFullYear()===n.getFullYear() && d.getMonth()===n.getMonth(); });
  const sum = (arr,f)=>arr.reduce((a,s)=>a+f(s),0);
  const revenueOf = s=>s.total;
  const profitOf = s=> s.items.reduce((a,it)=> a + (it.sellPrice - it.buyPrice) * it.qty, 0) - (s.discount||0);
  const todayRevenue = sum(todaySales, revenueOf), todayProfit = sum(todaySales, profitOf);
  const monthRevenue = sum(monthSales, revenueOf), monthProfit = sum(monthSales, profitOf);
  const lowStock = state.products.filter(p=>p.stock <= p.lowStock);
  const recent = [...state.sales].sort((a,b)=>b.date-a.date).slice(0,6);

  const salesCount = {};
  state.sales.forEach(s=> s.items.forEach(it=>{ salesCount[it.name] = (salesCount[it.name]||0) + it.qty; }));
  const topProducts = Object.entries(salesCount).sort((a,b)=>b[1]-a[1]).slice(0,5);

  const stat = (label, value, sub, color, iconName)=>`
    <div class="card stat-card">
      <div class="stat-icon" style="background:${color}22; color:${color};">${icon(iconName)}</div>
      <div class="fs-12 text-dim">${label}</div>
      <div class="fs-22 fw-700">${value}</div>
      ${sub?`<div class="fs-11 text-faint">${sub}</div>`:''}
    </div>`;

  return `
    <div class="grid grid-4 gap-4 mb-4">
      ${stat("Today's sales", fmtMoney(todayRevenue), `${todaySales.length} orders`, '#2563eb','pos')}
      ${stat("Today's profit", fmtMoney(todayProfit), '', '#22c55e','dashboard')}
      ${stat("Monthly revenue", fmtMoney(monthRevenue), `${monthSales.length} orders`, '#38bdf8','reports')}
      ${stat("Monthly profit", fmtMoney(monthProfit), '', '#f59e0b','reports')}
    </div>
    <div class="grid grid-4 gap-4 mb-4">
      ${stat('Products', state.products.length, `${state.categories.length} categories`, '#a78bfa','products')}
      ${stat('Low stock', lowStock.length, lowStock.length?'needs restock':'all good', lowStock.length?'#ef4444':'#22c55e','alert')}
      ${stat("Today's orders", todaySales.length, '', '#38bdf8','history')}
      ${stat('Avg. order', fmtMoney(todaySales.length? todayRevenue/todaySales.length : 0), '', '#2563eb','dashboard')}
    </div>
    <div class="grid grid-2 gap-4" style="align-items:start;">
      <div class="card card-pad">
        <div class="flex items-center justify-between mb-3">
          <div class="fw-600">Recent sales</div>
          <a href="#" data-route="history" class="fs-12 text-accent">View all</a>
        </div>
        ${recent.length ? `<table><thead><tr><th>Invoice</th><th>Time</th><th>Items</th><th class="text-right">Total</th></tr></thead><tbody>
          ${recent.map(s=>`<tr><td class="mono fs-13">${s.invoiceNo}</td><td class="fs-13 text-dim">${fmtTime(s.date)}</td><td class="fs-13 text-dim">${s.items.length}</td><td class="text-right mono fw-600">${fmtMoney(s.total)}</td></tr>`).join('')}
        </tbody></table>` : `<div class="empty">No sales recorded yet</div>`}
      </div>
      <div class="card card-pad">
        <div class="fw-600 mb-3">Top selling products</div>
        ${topProducts.length ? topProducts.map(([name,qty])=>{
          const max = topProducts[0][1];
          return `<div class="mb-3">
            <div class="flex items-center justify-between fs-13 mb-1"><span>${escapeHtml(name)}</span><span class="text-dim">${qty} sold</span></div>
            <div style="height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden;"><div style="height:100%;width:${(qty/max*100)}%;background:linear-gradient(90deg,var(--accent),var(--accent-2));"></div></div>
          </div>`;
        }).join('') : `<div class="empty">No sales yet</div>`}
        ${lowStock.length ? `<hr class="divider"><div class="fw-600 mb-2 fs-13 flex items-center gap-2">${icon('alert')} Low stock alerts</div>
          ${lowStock.slice(0,5).map(p=>`<div class="flex items-center justify-between fs-13 mb-2"><span>${escapeHtml(p.name)}</span><span class="badge badge-bad">${p.stock} left</span></div>`).join('')}` : ''}
      </div>
    </div>
  `;
}

              <div class="flex items-center justify-between">

        </div>
        <div style="max-height:280px; overflow:auto;" class="mb-3">
          ${state.cart.length ? state.cart.map((it,i)=>`
            <div class="flex items-center gap-2 mb-2">
              <div style="flex:1; min-width:0;">
                <div class="fs-13 fw-500" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(it.name)}</div>

          </div>

          <button class="btn btn-primary flex-1" id="completeSale" ${!canComplete ? 'disabled':''}>Complete sale</button>
        </div>
        <div class="fs-11 text-faint mt-2 text-center">Shortcut: <span class="kbd">Enter</span> to complete when ready</div>
      </div>
    </div>
  `;

function addToCart(productId){
  const p = state.products.find(x=>x.id===productId);
  if(!p || p.stock<=0) return;
  const existing = state.cart.find(it=>it.productId===productId);
  const inCartQty = existing ? existing.qty : 0;
  if(inCartQty + 1 > p.stock){ toast('Not enough stock', 'bad'); return; }
  if(existing) existing.qty += 1;
  else state.cart.push({productId:p.id, name:p.name, sellPrice:p.sellPrice, buyPrice:p.buyPrice, qty:1});
  renderPage();
}

function addToGrnCart(productId){
  const p = state.products.find(x=>x.id===productId);
  if(!p) return;
  const existing = state.grnCart.find(it=>it.productId===productId);
  if(existing) existing.qty += 1;
  else state.grnCart.push({productId:p.id, name:p.name, qty:1, cost:p.buyPrice});
  renderPage();
}

function openGrnModal(grn){
  if(!grn) return;
  const wrap = document.createElement('div'); wrap.innerHTML = grnModal(grn); document.body.appendChild(wrap.firstElementChild);
  const overlay = document.getElementById('grnModalOverlay');
  const close = ()=>overlay.remove();
  overlay.addEventListener('click', e=>{ if(e.target===overlay) close(); });
  document.getElementById('closeGrnModal').addEventListener('click', close);
  document.getElementById('closeGrnModal2').addEventListener('click', close);
}

function completeGrnHandler(){
  const items = state.grnCart.filter(it=>Number(it.qty)>0);
  if(!items.length){ toast('Add at least one item with a quantity','bad'); return; }
  const grnNo = state.settings.grnPrefix + state.settings.grnCounter;
  const grn = {
    id: uid('g_'), grnNo, date: Date.now(),
    supplier: state.grnSupplier.trim(), notes: state.grnNotes.trim(),
    items: items.map(it=>({productId:it.productId, name:it.name, qty:Number(it.qty)||0, cost:Number(it.cost)||0}))
  };
  grn.items.forEach(it=>{
    const p = state.products.find(x=>x.id===it.productId);
    if(p){ p.stock += it.qty; if(it.cost>0) p.buyPrice = it.cost; }
  });
  state.grns.push(grn);
  state.settings.grnCounter += 1;
  persist('products'); persist('grns'); persist('settings');
  state.grnCart = []; state.grnSupplier=''; state.grnNotes='';
  renderPage();
  toast(`${grnNo} recorded — stock updated`);
  openGrnModal(grn);
}

--------------------------------------------------------- */
function pageReports(){
  const range = state.reportRange || 'today';
  const now = Date.now();
  function inRange(ts){
    const d = new Date(ts), n = new Date(now);
    if(range==='today') return todayKey(ts)===todayKey(now);
    if(range==='week'){ const diff=(now-ts)/86400000; return diff>=0 && diff<7; }
    if(range==='month') return d.getFullYear()===n.getFullYear() && d.getMonth()===n.getMonth();
    return true;
  }
  const sales = state.sales.filter(s=>inRange(s.date));
  const revenue = sales.reduce((a,s)=>a+s.total,0);
  const profit = sales.reduce((a,s)=> a + s.items.reduce((x,it)=>x+(it.sellPrice-it.buyPrice)*it.qty,0) - (s.discount||0), 0);
  const txns = sales.length;
  const avg = txns? revenue/txns : 0;

  const prodTotals = {};
  sales.forEach(s=> s.items.forEach(it=>{ prodTotals[it.name] = (prodTotals[it.name]||0)+it.qty; }));
  const sortedProds = Object.entries(prodTotals).sort((a,b)=>b[1]-a[1]);
  const mostSold = sortedProds.slice(0,5);
  const leastSold = sortedProds.slice(-5).reverse();

  const catTotals = {};
  sales.forEach(s=> s.items.forEach(it=>{
    const prod = state.products.find(p=>p.id===it.productId);
    const cat = prod?prod.category:'Other';
    catTotals[cat] = (catTotals[cat]||0) + it.sellPrice*it.qty;
  }));
  const catEntries = Object.entries(catTotals).sort((a,b)=>b[1]-a[1]);
  const catMax = catEntries.length? catEntries[0][1] : 1;

  const hourly = Array(24).fill(0);
  sales.forEach(s=>{ hourly[new Date(s.date).getHours()] += s.total; });
  const hourMax = Math.max(...hourly, 1);

  const stat=(label,val)=>`<div class="card card-pad"><div class="fs-12 text-dim mb-1">${label}</div><div class="fs-22 fw-700">${val}</div></div>`;

  return `
    <div class="flex items-center justify-between mb-4 flex-wrap gap-2">
      <div class="flex gap-2">
        ${['today','week','month'].map(r=>`<button class="pill-tab ${range===r?'active':''}" data-reportrange="${r}">${r==='today'?"Today":r==='week'?'This week':'This month'}</button>`).join('')}
      </div>
      <div class="flex gap-2">
        <button class="btn btn-ghost btn-sm" id="printReportBtn">${icon('print')} Print</button>
        <button class="btn btn-ghost btn-sm" id="exportReportCsv">${icon('backup')} Export CSV</button>
      </div>
    </div>
    <div class="grid grid-4 gap-4 mb-4">
      ${stat('Revenue', fmtMoney(revenue))}
      ${stat('Profit', fmtMoney(profit))}
      ${stat('Transactions', txns)}
      ${stat('Average sale', fmtMoney(avg))}
    </div>
    <div class="grid grid-2 gap-4 mb-4">
      <div class="card card-pad">
        <div class="fw-600 mb-3">Most sold products</div>
        ${mostSold.length? mostSold.map(([n,q])=>`<div class="flex justify-between fs-13 mb-2"><span>${escapeHtml(n)}</span><span class="mono text-dim">${q}</span></div>`).join('') : `<div class="empty">No data</div>`}
      </div>
      <div class="card card-pad">
        <div class="fw-600 mb-3">Least sold products</div>
        ${leastSold.length? leastSold.map(([n,q])=>`<div class="flex justify-between fs-13 mb-2"><span>${escapeHtml(n)}</span><span class="mono text-dim">${q}</span></div>`).join('') : `<div class="empty">No data</div>`}
      </div>
    </div>
    <div class="grid grid-2 gap-4">
      <div class="card card-pad">
        <div class="fw-600 mb-3">Category sales</div>
        ${catEntries.length? catEntries.map(([c,v])=>`
          <div class="mb-3">
            <div class="flex justify-between fs-13 mb-1"><span>${escapeHtml(c)}</span><span class="mono">${fmtMoney(v)}</span></div>
            <div style="height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden;"><div style="height:100%;width:${(v/catMax*100)}%;background:linear-gradient(90deg,var(--accent),var(--accent-2));"></div></div>
          </div>`).join('') : `<div class="empty">No data</div>`}
      </div>
      <div class="card card-pad">
        <div class="fw-600 mb-3">Hourly sales</div>
        <div class="flex items-end gap-1" style="height:120px;">
          ${hourly.map((v,h)=>`<div title="${h}:00 — ${fmtMoney(v)}" style="flex:1;background:linear-gradient(180deg,var(--accent-2),var(--accent));border-radius:3px 3px 0 0;height:${Math.max(2,(v/hourMax*100))}%;"></div>`).join('')}
        </div>
        <div class="flex justify-between fs-11 text-faint mt-2"><span>12am</span><span>12pm</span><span>11pm</span></div>
      </div>
    </div>
  `;
}

function download(filename, obj){
  const blob = new Blob([JSON.stringify(obj,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}
function downloadCSV(filename, csvText){
  const blob = new Blob([csvText], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}
function csvEscape(v){ const s=String(v==null?'':v); return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; }
function readFile(file, cb){
  const reader = new FileReader();
  reader.onload = e=>{ try{ cb(JSON.parse(e.target.result)); }catch(err){ toast('Invalid JSON file', 'bad'); } };
  reader.readAsText(file);
}

        <div class="fs-12 text-dim mb-1">This install's ID</div>

        <div class="fs-11 text-faint">${isTrialUnlocked() ? 'This install is permanently unlocked.' : (trialDaysLeft()===Infinity ? 'Trial lock is currently disabled.' : `${Math.max(trialDaysLeft(),0)} day(s) left in this install's trial.`)}</div>

        </div>
        <div class="flex items-center justify-between mb-3">

        </div>
        <div class="flex items-center justify-between mb-3">
          <span class="fs-13">Sales History</span>

        </div>
        <div class="flex items-center justify-between mb-3">
          <span class="fs-13">Reports</span>

/* ---------------------------------------------------------
   14. RECEIPT
--------------------------------------------------------- */
function receiptHtml(sale){
  const s = state.settings;
  const sizeClass = s.receiptSize==='58mm' ? 'receipt-58' : s.receiptSize==='a4' ? 'receipt-a4' : 'receipt-80';
  return `
    <div class="receipt ${sizeClass}">
      <div class="text-center">
        ${s.logo?`<img src="${escapeHtml(s.logo)}" style="max-height:50px;margin:0 auto 6px;" onerror="this.style.display='none'">`:''}
        <div style="font-weight:700;font-size:14px;">${escapeHtml(s.companyName)}</div>
        <div style="font-size:11px;">${escapeHtml(s.address)}</div>
        <div style="font-size:11px;">${escapeHtml(s.phone)}</div>
      </div>
      <hr>
      <div class="rline"><span>Invoice</span><span>${sale.invoiceNo}</span></div>
      <div class="rline"><span>Date</span><span>${fmtDate(sale.date)}</span></div>
      <div class="rline"><span>Time</span><span>${fmtTime(sale.date)}</span></div>
      <div class="rline"><span>Cashier</span><span>${escapeHtml(sale.cashierName || s.cashierName)}</span></div>
      <hr>
      ${sale.items.map(it=>`
        <div class="rline"><span>${escapeHtml(it.name)}</span><span></span></div>
        <div class="rline"><span>&nbsp;&nbsp;${it.qty} x ${fmtMoney(it.sellPrice)}</span><span>${fmtMoney(it.qty*it.sellPrice)}</span></div>
      `).join('')}
      <hr>
      <div class="rline"><span>Subtotal</span><span>${fmtMoney(sale.subtotal)}</span></div>
      <div class="rline"><span>Discount</span><span>-${fmtMoney(sale.discount)}</span></div>
      <div class="rline"><span>Tax</span><span>${fmtMoney(sale.tax)}</span></div>
      <div class="rline" style="font-weight:700;font-size:14px;"><span>TOTAL</span><span>${fmtMoney(sale.total)}</span></div>
      <hr>
      <div class="rline"><span>Payment</span><span>${sale.paymentMethod==='card'?'Card':'Cash'}</span></div>
      ${sale.paymentMethod==='card' ? '' : `
      <div class="rline"><span>Cash</span><span>${fmtMoney(sale.cash)}</span></div>
      <div class="rline"><span>Balance</span><span>${fmtMoney(sale.balance)}</span></div>
      `}
      <hr>
      <div class="text-center" style="margin-top:6px;">
        <div style="letter-spacing:3px;font-size:10px;">*|${sale.invoiceNo}|*</div>
        <div style="font-size:11px;margin-top:6px;">${escapeHtml(s.footer)}</div>
      </div>
    </div>
  `;
}

function saleModal(sale){
  return `
    <div class="modal-overlay" id="saleModalOverlay">
      <div class="modal">
        <div class="modal-header"><div class="fw-600 fs-16">Receipt ${sale.invoiceNo}</div><button class="btn btn-ghost btn-icon" id="closeSaleModal">${icon('close')}</button></div>
        <div class="modal-body" style="background:var(--surface-2);">${receiptHtml(sale)}</div>
        <div class="modal-footer">
          <button class="btn btn-ghost" id="closeSaleModal2">Close</button>
          <button class="btn btn-primary" id="printSaleBtn">${icon('print')} Print</button>
        </div>
      </div>
    </div>`;
}

function doPrint(sale){
  document.getElementById('printArea').innerHTML = receiptHtml(sale);
  window.print();
}

/* ---------------------------------------------------------
   15. EVENT BINDING (delegated per-page after render)
--------------------------------------------------------- */
function bindPageEvents(){
  // --- POS ---
  const posSearch = document.getElementById('posSearch');
  if(posSearch){
    posSearch.addEventListener('input', e=>{
      const val = e.target.value;
      const trimmed = val.trim();
      // auto-add on exact barcode / product code match — handles scanners that don't send Enter
      if(trimmed.length >= 4){
        const exact = state.products.find(p=> p.barcode===trimmed || (p.productCode && p.productCode===trimmed));
        if(exact){
          addToCart(exact.id);
          state.productSearch = '';
          renderPage();
          document.getElementById('posSearch')?.focus();
          return;
        }
      }
      state.productSearch = val; renderPage(); positionCaret(document.getElementById('posSearch'));
    });
    posSearch.addEventListener('keydown', e=>{
      if(e.key==='Enter'){
        const trimmed = state.productSearch.trim();
        const exact = state.products.find(p=> p.barcode===trimmed || (p.productCode && p.productCode===trimmed));
        if(exact){ addToCart(exact.id); state.productSearch=''; renderPage(); document.getElementById('posSearch')?.focus(); }
      }
    });
  }
  document.querySelectorAll('[data-catfilter]').forEach(b=>b.addEventListener('click', ()=>{ state.productCategoryFilter=b.getAttribute('data-catfilter'); renderPage(); }));
  document.querySelectorAll('[data-addcart]').forEach(b=>b.addEventListener('click', ()=>addToCart(b.getAttribute('data-addcart'))));
  document.querySelectorAll('[data-qtyup]').forEach(b=>b.addEventListener('click', ()=>{
    const i=+b.getAttribute('data-qtyup'); const it=state.cart[i]; const p=state.products.find(x=>x.id===it.productId);
    if(it.qty+1>p.stock){ toast('Not enough stock','bad'); return; } it.qty++; renderPage();
  }));
  document.querySelectorAll('[data-qtydown]').forEach(b=>b.addEventListener('click', ()=>{
    const i=+b.getAttribute('data-qtydown'); state.cart[i].qty--; if(state.cart[i].qty<=0) state.cart.splice(i,1); renderPage();
  }));
  document.querySelectorAll('[data-removecart]').forEach(b=>b.addEventListener('click', ()=>{ state.cart.splice(+b.getAttribute('data-removecart'),1); renderPage(); }));
  const clearCart = document.getElementById('clearCart');
  if(clearCart) clearCart.addEventListener('click', ()=>{ state.cart=[]; state.cashReceived=''; state.cartDiscount=0; renderPage(); });
  const discInput = document.getElementById('cartDiscount');
  if(discInput) discInput.addEventListener('input', e=>{ state.cartDiscount = sanitizeNumInput(e.target.value); renderPage(); positionCaret(document.getElementById('cartDiscount')); });
  const discType = document.getElementById('cartDiscountType');
  if(discType) discType.addEventListener('change', e=>{ state.cartDiscountType = e.target.value; renderPage(); });
  const cashInput = document.getElementById('cashReceived');
  if(cashInput) cashInput.addEventListener('input', e=>{ state.cashReceived = sanitizeNumInput(e.target.value); renderPage(); positionCaret(document.getElementById('cashReceived')); });
  document.querySelectorAll('[data-paymethod]').forEach(b=>b.addEventListener('click', ()=>{ state.paymentMethod = b.getAttribute('data-paymethod'); renderPage(); }));
  const cancelSale = document.getElementById('cancelSale');
  if(cancelSale) cancelSale.addEventListener('click', ()=>{ state.cart=[]; state.cashReceived=''; state.cartDiscount=0; state.paymentMethod='cash'; renderPage(); toast('Sale cancelled','warn'); });
  const completeSale = document.getElementById('completeSale');
  if(completeSale) completeSale.addEventListener('click', completeSaleHandler);

  // --- Products ---
  const prodSearch = document.getElementById('prodSearch');
  if(prodSearch) prodSearch.addEventListener('input', e=>{ state.productSearch=e.target.value; renderPage(); positionCaret(document.getElementById('prodSearch')); });
  const addProdBtn = document.getElementById('addProductBtn');
  if(addProdBtn) addProdBtn.addEventListener('click', ()=>openProductModal(null));
  document.querySelectorAll('[data-editprod]').forEach(b=>b.addEventListener('click', ()=>openProductModal(state.products.find(p=>p.id===b.getAttribute('data-editprod')))));
  document.querySelectorAll('[data-delprod]').forEach(b=>b.addEventListener('click', ()=>{
    if(confirm('Delete this product? This cannot be undone.')){
      state.products = state.products.filter(p=>p.id!==b.getAttribute('data-delprod')); persist('products'); renderPage(); toast('Product deleted','warn');
    }
  }));

  // --- GRN (Stock In) ---
  const grnSearch = document.getElementById('grnSearch');
  if(grnSearch) grnSearch.addEventListener('input', e=>{
    const val = e.target.value; const trimmed = val.trim();
    if(trimmed.length >= 4){
      const exact = state.products.find(p=> p.barcode===trimmed || (p.productCode && p.productCode===trimmed));
      if(exact){ addToGrnCart(exact.id); state.grnSearch=''; renderPage(); document.getElementById('grnSearch')?.focus(); return; }
    }
    state.grnSearch=val; renderPage(); positionCaret(document.getElementById('grnSearch'));
  });
  document.querySelectorAll('[data-addgrn]').forEach(b=>b.addEventListener('click', ()=>addToGrnCart(b.getAttribute('data-addgrn'))));
  document.querySelectorAll('[data-grnqty]').forEach(inp=>inp.addEventListener('input', e=>{
    const i = +inp.getAttribute('data-grnqty'); state.grnCart[i].qty = sanitizeNumInput(e.target.value);
    renderPage(); positionCaret(document.querySelector(`[data-grnqty="${i}"]`));
  }));
  document.querySelectorAll('[data-grncost]').forEach(inp=>inp.addEventListener('input', e=>{
    const i = +inp.getAttribute('data-grncost'); state.grnCart[i].cost = sanitizeNumInput(e.target.value);
    renderPage(); positionCaret(document.querySelector(`[data-grncost="${i}"]`));
  }));
  document.querySelectorAll('[data-removegrn]').forEach(b=>b.addEventListener('click', ()=>{ state.grnCart.splice(+b.getAttribute('data-removegrn'),1); renderPage(); }));
  const grnSupplier = document.getElementById('grnSupplier');
  if(grnSupplier) grnSupplier.addEventListener('input', e=>{ state.grnSupplier=e.target.value; renderPage(); positionCaret(document.getElementById('grnSupplier')); });
  const grnNotes = document.getElementById('grnNotes');
  if(grnNotes) grnNotes.addEventListener('input', e=>{ state.grnNotes=e.target.value; renderPage(); positionCaret(document.getElementById('grnNotes')); });
  const cancelGrn = document.getElementById('cancelGrn');
  if(cancelGrn) cancelGrn.addEventListener('click', ()=>{ state.grnCart=[]; state.grnSupplier=''; state.grnNotes=''; renderPage(); toast('GRN cancelled','warn'); });
  const completeGrn = document.getElementById('completeGrn');
  if(completeGrn) completeGrn.addEventListener('click', completeGrnHandler);
  const grnHistSearch = document.getElementById('grnHistSearch');
  if(grnHistSearch) grnHistSearch.addEventListener('input', e=>{ state.grnHistorySearch=e.target.value; renderPage(); positionCaret(document.getElementById('grnHistSearch')); });
  document.querySelectorAll('[data-viewgrn]').forEach(b=>b.addEventListener('click', ()=>openGrnModal(state.grns.find(g=>g.id===b.getAttribute('data-viewgrn')))));
  document.querySelectorAll('[data-delgrn]').forEach(b=>b.addEventListener('click', ()=>{
    if(confirm('Delete this GRN record? This will NOT reverse the stock it added.')){
      state.grns = state.grns.filter(g=>g.id!==b.getAttribute('data-delgrn')); persist('grns'); renderPage(); toast('GRN record deleted','warn');
    }
  }));

  // --- History ---
  const histSearch = document.getElementById('histSearch');
  if(histSearch) histSearch.addEventListener('input', e=>{ state.historySearch=e.target.value; renderPage(); positionCaret(document.getElementById('histSearch')); });
  document.querySelectorAll('[data-viewsale]').forEach(b=>b.addEventListener('click', ()=>openSaleModal(state.sales.find(s=>s.id===b.getAttribute('data-viewsale')))));
  document.querySelectorAll('[data-delsale]').forEach(b=>b.addEventListener('click', ()=>{
    if(state.role!=='admin' && !state.settings.staffPermissions.cancelSale){ toast('You do not have permission to cancel bills','bad'); return; }
    if(confirm('Delete this sale record? This cannot be undone.')){
      state.sales = state.sales.filter(s=>s.id!==b.getAttribute('data-delsale')); persist('sales'); renderPage(); toast('Sale deleted','warn');
    }
  }));

  // --- Reports ---
  document.querySelectorAll('[data-reportrange]').forEach(b=>b.addEventListener('click', ()=>{ state.reportRange=b.getAttribute('data-reportrange'); renderPage(); }));
  const exportReportCsv = document.getElementById('exportReportCsv');
  if(exportReportCsv) exportReportCsv.addEventListener('click', ()=>{
    const range = state.reportRange || 'today';
    const now = Date.now();
    const inRange = ts=>{
      const d=new Date(ts), n=new Date(now);
      if(range==='today') return todayKey(ts)===todayKey(now);
      if(range==='week'){ const diff=(now-ts)/86400000; return diff>=0 && diff<7; }
      if(range==='month') return d.getFullYear()===n.getFullYear() && d.getMonth()===n.getMonth();
      return true;
    };
    const sales = state.sales.filter(s=>inRange(s.date));
    const rows = [['Invoice','Date','Product','Qty','Unit Price','Line Total','Payment Method','Sale Subtotal','Sale Discount','Sale Tax','Sale Total']];
    sales.forEach(s=>{
      s.items.forEach(it=>{
        rows.push([s.invoiceNo, fmtDateTime(s.date), it.name, it.qty, it.sellPrice.toFixed(2), (it.qty*it.sellPrice).toFixed(2), s.paymentMethod||'cash', s.subtotal.toFixed(2), s.discount.toFixed(2), s.tax.toFixed(2), s.total.toFixed(2)]);
      });
    });
    const csv = rows.map(r=>r.map(csvEscape).join(',')).join('\n');
    downloadCSV(`report_${range}_${todayKey(now)}.csv`, csv);
    toast('Report exported');
  });
  const printReportBtn = document.getElementById('printReportBtn');
  if(printReportBtn) printReportBtn.addEventListener('click', ()=>{
    const range = state.reportRange || 'today';
    const rangeLabel = range==='today'?'Today':range==='week'?'This week':'This month';
    const now = Date.now();
    const inRange = ts=>{
      const d=new Date(ts), n=new Date(now);
      if(range==='today') return todayKey(ts)===todayKey(now);
      if(range==='week'){ const diff=(now-ts)/86400000; return diff>=0 && diff<7; }
      if(range==='month') return d.getFullYear()===n.getFullYear() && d.getMonth()===n.getMonth();
      return true;
    };
    const sales = state.sales.filter(s=>inRange(s.date));
    const revenue = sales.reduce((a,s)=>a+s.total,0);
    const profit = sales.reduce((a,s)=> a + s.items.reduce((x,it)=>x+(it.sellPrice-it.buyPrice)*it.qty,0) - (s.discount||0), 0);
    const txns = sales.length;
    const avg = txns? revenue/txns : 0;
    const prodTotals = {};
    sales.forEach(s=> s.items.forEach(it=>{ prodTotals[it.name] = (prodTotals[it.name]||0)+it.qty; }));
    const sortedProds = Object.entries(prodTotals).sort((a,b)=>b[1]-a[1]);
    const catTotals = {};
    sales.forEach(s=> s.items.forEach(it=>{
      const prod = state.products.find(p=>p.id===it.productId);
      const cat = prod?prod.category:'Other';
      catTotals[cat] = (catTotals[cat]||0) + it.sellPrice*it.qty;
    }));
    const s = state.settings;
    const html = `
      <div style="font-family:Arial,sans-serif;padding:24px;max-width:800px;margin:0 auto;">
        <div style="text-align:center;margin-bottom:20px;">
          <div style="font-size:18px;font-weight:700;">${escapeHtml(s.companyName)}</div>
          <div style="font-size:12px;color:#555;">${escapeHtml(s.address)} · ${escapeHtml(s.phone)}</div>
          <div style="font-size:14px;font-weight:600;margin-top:10px;">Sales Report — ${rangeLabel}</div>
          <div style="font-size:11px;color:#777;">Generated ${fmtDateTime(now)}</div>
        </div>
        <table style="width:100%;border-collapse:collapse;margin-bottom:20px;">
          <tr><td style="padding:6px;border:1px solid #ccc;">Revenue</td><td style="padding:6px;border:1px solid #ccc;text-align:right;">${fmtMoney(revenue)}</td></tr>
          <tr><td style="padding:6px;border:1px solid #ccc;">Profit</td><td style="padding:6px;border:1px solid #ccc;text-align:right;">${fmtMoney(profit)}</td></tr>
          <tr><td style="padding:6px;border:1px solid #ccc;">Transactions</td><td style="padding:6px;border:1px solid #ccc;text-align:right;">${txns}</td></tr>
          <tr><td style="padding:6px;border:1px solid #ccc;">Average sale</td><td style="padding:6px;border:1px solid #ccc;text-align:right;">${fmtMoney(avg)}</td></tr>
        </table>
        <div style="font-weight:600;margin-bottom:8px;">Products sold</div>
        <table style="width:100%;border-collapse:collapse;margin-bottom:20px;font-size:13px;">
          <tr><th style="text-align:left;padding:6px;border:1px solid #ccc;">Product</th><th style="text-align:right;padding:6px;border:1px solid #ccc;">Qty sold</th></tr>
          ${sortedProds.map(([n,q])=>`<tr><td style="padding:6px;border:1px solid #ccc;">${escapeHtml(n)}</td><td style="padding:6px;border:1px solid #ccc;text-align:right;">${q}</td></tr>`).join('') || '<tr><td colspan="2" style="padding:6px;border:1px solid #ccc;text-align:center;color:#777;">No sales</td></tr>'}
        </table>
        <div style="font-weight:600;margin-bottom:8px;">Category sales</div>
        <table style="width:100%;border-collapse:collapse;font-size:13px;">
          <tr><th style="text-align:left;padding:6px;border:1px solid #ccc;">Category</th><th style="text-align:right;padding:6px;border:1px solid #ccc;">Revenue</th></tr>
          ${Object.entries(catTotals).sort((a,b)=>b[1]-a[1]).map(([c,v])=>`<tr><td style="padding:6px;border:1px solid #ccc;">${escapeHtml(c)}</td><td style="padding:6px;border:1px solid #ccc;text-align:right;">${fmtMoney(v)}</td></tr>`).join('') || '<tr><td colspan="2" style="padding:6px;border:1px solid #ccc;text-align:center;color:#777;">No sales</td></tr>'}
        </table>
      </div>
    `;
    document.getElementById('printArea').innerHTML = html;
    window.print();
  });

  // --- Backup ---
  const expProducts = document.getElementById('expProducts');
  if(expProducts) expProducts.addEventListener('click', ()=>download('products.json', state.products));
  const expSales = document.getElementById('expSales');
  if(expSales) expSales.addEventListener('click', ()=>download('sales.json', state.sales));
  const expAll = document.getElementById('expAll');
  if(expAll) expAll.addEventListener('click', ()=>download('maduranga_pos_backup.json', {settings:state.settings, products:state.products, categories:state.categories, sales:state.sales}));
  const impProducts = document.getElementById('impProducts');
  if(impProducts) impProducts.addEventListener('change', e=>{
    if(!e.target.files[0]) return;
    readFile(e.target.files[0], data=>{ if(Array.isArray(data)){ state.products=data; persist('products'); renderPage(); toast('Products imported'); } else toast('Invalid products file','bad'); });
  });
  const impAll = document.getElementById('impAll');
  if(impAll) impAll.addEventListener('change', e=>{
    if(!e.target.files[0]) return;
    readFile(e.target.files[0], data=>{
      if(data.settings) state.settings=data.settings;
      if(data.products) state.products=data.products;
      if(data.categories) state.categories=data.categories;
      if(data.sales) state.sales=data.sales;
      persist('settings'); persist('products'); persist('categories'); persist('sales');
      document.body.setAttribute('data-theme', state.settings.theme);
      document.documentElement.style.setProperty('--accent', state.settings.themeColor||'#2563eb');
      render(); toast('Backup restored');
    });
  });
  const resetAll = document.getElementById('resetAll');
  if(resetAll) resetAll.addEventListener('click', ()=>{
    if(confirm('This will permanently erase ALL data. Are you absolutely sure?') && confirm('Really erase everything? This is your last chance to cancel.')){
      localStorage.clear();
      location.reload();
    }
  });

  // --- Settings ---
  const saveSettingsBtn = document.getElementById('saveSettingsBtn');
  if(saveSettingsBtn) saveSettingsBtn.addEventListener('click', ()=>{
    const s = state.settings;
    s.companyName = document.getElementById('st_name').value || 'Your Company';
    s.address = document.getElementById('st_address').value;
    s.phone = document.getElementById('st_phone').value;
    s.cashierName = document.getElementById('st_cashier').value || 'Cashier';
    s.currency = document.getElementById('st_currency').value || '$';
    s.taxPercent = Number(document.getElementById('st_tax').value)||0;
    s.invoicePrefix = document.getElementById('st_prefix').value || 'INV-';
    s.invoiceCounter = Number(document.getElementById('st_counter').value)||1;
    s.receiptSize = document.getElementById('st_receiptsize').value;
    s.footer = document.getElementById('st_footer').value;
    s.themeColor = document.getElementById('st_color').value;
    s.password = document.getElementById('st_password').value;
    const ownerPassEl = document.getElementById('st_ownerpassword');
    if(ownerPassEl) s.ownerPassword = ownerPassEl.value;
    const trialDaysEl = document.getElementById('st_trialdays');
    if(trialDaysEl) s.trialDays = Number(trialDaysEl.value)||0;
    const billingCycleEl = document.getElementById('st_billingcycle');
    if(billingCycleEl) s.billingCycleDays = Number(billingCycleEl.value)||0;
    persist('settings');
    document.documentElement.style.setProperty('--accent', s.themeColor);
    render();
    toast('Settings saved');
  });
  const addCashierBtn = document.getElementById('addCashierBtn');
  if(addCashierBtn) addCashierBtn.addEventListener('click', ()=>openCashierModal(null));
  document.querySelectorAll('[data-editcashier]').forEach(b=>b.addEventListener('click', ()=>openCashierModal(state.cashiers.find(c=>c.id===b.getAttribute('data-editcashier')))));
  document.querySelectorAll('[data-delcashier]').forEach(b=>b.addEventListener('click', ()=>{
    if(confirm('Remove this cashier account? They will no longer be able to log in.')){
      state.cashiers = state.cashiers.filter(c=>c.id!==b.getAttribute('data-delcashier'));
      persist('cashiers'); renderPage(); toast('Cashier removed','warn');
    }
  }));
  const themeSwitch = document.getElementById('st_themeswitch');
  if(themeSwitch) themeSwitch.addEventListener('click', ()=>{
    state.settings.theme = state.settings.theme==='dark' ? 'light' : 'dark';
    document.body.setAttribute('data-theme', state.settings.theme);
    persist('settings'); renderPage();
  });
  const cashierKill = document.getElementById('st_cashierkill');
  if(cashierKill) cashierKill.addEventListener('click', ()=>{
    state.settings.cashierManuallyDisabled = !state.settings.cashierManuallyDisabled;
    persist('settings');
    toast(state.settings.cashierManuallyDisabled ? 'Cashier account disabled' : 'Cashier account re-enabled', state.settings.cashierManuallyDisabled?'warn':'good');
    renderPage();
  });
  const adminKill = document.getElementById('st_adminkill');
  if(adminKill) adminKill.addEventListener('click', ()=>{
    state.settings.adminManuallyDisabled = !state.settings.adminManuallyDisabled;
    persist('settings');
    toast(state.settings.adminManuallyDisabled ? 'Admin account disabled' : 'Admin account re-enabled', state.settings.adminManuallyDisabled?'warn':'good');
    renderPage();
  });
  const markPaymentBtn = document.getElementById('markPaymentBtn');
  if(markPaymentBtn) markPaymentBtn.addEventListener('click', ()=>{
    state.settings.lastPaymentDate = Date.now();
    persist('settings');
    toast('Payment marked as received today');
    renderPage();
  });
  const recheckRemoteBtn = document.getElementById('recheckRemoteBtn');
  if(recheckRemoteBtn) recheckRemoteBtn.addEventListener('click', async ()=>{
    recheckRemoteBtn.textContent = 'Checking...';
    await checkRemoteLicense(true);
    toast('Checked');
    renderPage();
  });
  const logoUpload = document.getElementById('st_logo_upload');
  if(logoUpload) logoUpload.addEventListener('change', e=>{
    const file = e.target.files[0];
    if(!file) return;
    if(!file.type.startsWith('image/')){ toast('Please choose an image file','bad'); return; }
    if(file.size > 1024*1024){ toast('Logo image is too large — please use one under 1MB','bad'); return; }
    const reader = new FileReader();
    reader.onload = ev=>{
      state.settings.logo = ev.target.result;
      persist('settings');
      document.documentElement.style.setProperty('--accent', state.settings.themeColor);
      toast('Logo updated');
      renderPage();
    };
    reader.readAsDataURL(file);
  });
  const removeLogoBtn = document.getElementById('removeLogoBtn');
  if(removeLogoBtn) removeLogoBtn.addEventListener('click', ()=>{
    state.settings.logo = '';
    persist('settings');
    toast('Logo removed','warn');
    renderPage();
  });
  const useLogoUrlBtn = document.getElementById('useLogoUrlBtn');
  if(useLogoUrlBtn) useLogoUrlBtn.addEventListener('click', ()=>{
    const url = document.getElementById('st_logo_url').value.trim();
    if(!url){ toast('Paste an image URL first','bad'); return; }
    if(!/^https?:\/\//i.test(url) && !/^data:image\//i.test(url)){ toast('Please use a link starting with http:// or https://','bad'); return; }
    state.settings.logo = url;
    persist('settings');
    toast('Logo updated');
    renderPage();
  });
  document.querySelectorAll('[data-permtoggle]').forEach(sw=>sw.addEventListener('click', ()=>{
    const key = sw.getAttribute('data-permtoggle');
    state.settings.staffPermissions[key] = !state.settings.staffPermissions[key];
    persist('settings'); renderPage();
  }));
  const addCatBtn = document.getElementById('addCatBtn');
  if(addCatBtn) addCatBtn.addEventListener('click', ()=>{
    const val = document.getElementById('newCatInput').value.trim();
    if(val && !state.categories.includes(val)){ state.categories.push(val); persist('categories'); renderPage(); }
  });
  document.querySelectorAll('[data-delcat]').forEach(b=>b.addEventListener('click', ()=>{
    state.categories.splice(+b.getAttribute('data-delcat'),1); persist('categories'); renderPage();
  }));
}

function positionCaret(input){
  if(!input) return;
  try{ const v=input.value; input.focus(); input.setSelectionRange(v.length,v.length); }
  catch(e){ input.focus(); }
}
function sanitizeNumInput(raw){
  let v = raw.replace(/[^0-9.]/g, '');
  const parts = v.split('.');
  if(parts.length > 2) v = parts[0] + '.' + parts.slice(1).join('');
  return v;
}

/* ---------------------------------------------------------
   16. PRODUCT MODAL LOGIC
--------------------------------------------------------- */
function openProductModal(product){
  const wrap = document.createElement('div'); wrap.innerHTML = productModal(product); document.body.appendChild(wrap.firstElementChild);
  const overlay = document.getElementById('prodModalOverlay');
  const close = ()=>overlay.remove();
  overlay.addEventListener('click', e=>{ if(e.target===overlay) close(); });
  document.getElementById('closeProdModal').addEventListener('click', close);
  document.getElementById('cancelProdModal').addEventListener('click', close);
  document.getElementById('saveProdModal').addEventListener('click', ()=>{
    const name = document.getElementById('f_name').value.trim();
    if(!name){ toast('Product name is required','bad'); return; }
    const productCode = document.getElementById('f_code').value.trim();
    const barcode = document.getElementById('f_barcode').value.trim() || String(Math.floor(1000000000000+Math.random()*8999999999999));
    if(productCode){
      const dupeCode = state.products.find(p=> p.productCode && p.productCode===productCode && (!product || p.id!==product.id));
      if(dupeCode){ toast(`Product code "${productCode}" is already used by "${dupeCode.name}"`,'bad'); return; }
    }
    const dupeBarcode = state.products.find(p=> p.barcode===barcode && (!product || p.id!==product.id));
    if(dupeBarcode){ toast(`Barcode "${barcode}" is already used by "${dupeBarcode.name}"`,'bad'); return; }
    const data = {
      name,
      category: document.getElementById('f_category').value,
      productCode,
      sku: document.getElementById('f_sku').value.trim() || 'SKU'+Math.floor(1000+Math.random()*9000),
      barcode,
      buyPrice: state.role==='staff' ? (product ? product.buyPrice : 0) : (Number(document.getElementById('f_buy').value)||0),
      sellPrice: state.role==='staff' ? (product ? product.sellPrice : 0) : (Number(document.getElementById('f_sell').value)||0),
      stock: Number(document.getElementById('f_stock').value)||0,
      lowStock: Number(document.getElementById('f_low').value)||5,
      image: document.getElementById('f_image').value.trim(),
    };
    if(product){ Object.assign(product, data); toast('Product updated'); }
    else { state.products.push({id:uid('p_'), ...data}); toast('Product added'); }
    persist('products'); close(); renderPage();
  });
}

function openCashierModal(cashier){
  const wrap = document.createElement('div'); wrap.innerHTML = cashierModal(cashier); document.body.appendChild(wrap.firstElementChild);
  const overlay = document.getElementById('cashierModalOverlay');
  const close = ()=>overlay.remove();
  overlay.addEventListener('click', e=>{ if(e.target===overlay) close(); });
  document.getElementById('closeCashierModal').addEventListener('click', close);
  document.getElementById('cancelCashierModal').addEventListener('click', close);
  let enabledVal = cashier ? cashier.enabled : true;
  const enabledSwitch = document.getElementById('cf_enabled');
  enabledSwitch.addEventListener('click', ()=>{ enabledVal = !enabledVal; enabledSwitch.classList.toggle('on', enabledVal); });
  document.getElementById('saveCashierModal').addEventListener('click', ()=>{
    const name = document.getElementById('cf_name').value.trim();
    const password = document.getElementById('cf_password').value.trim();
    if(!name){ toast('Cashier name is required','bad'); return; }
    if(!password){ toast('Password is required','bad'); return; }
    const dupe = state.cashiers.find(c=>c.password===password && (!cashier || c.id!==cashier.id));
    if(dupe){ toast('Another cashier already uses that password','bad'); return; }
    if(cashier){ cashier.name=name; cashier.password=password; cashier.enabled=enabledVal; toast('Cashier updated'); }
    else { state.cashiers.push({id:uid('c_'), name, password, enabled:enabledVal}); toast('Cashier added'); }
    persist('cashiers'); close(); renderPage();
  });
}

function openSaleModal(sale){
  if(!sale) return;
  const wrap = document.createElement('div'); wrap.innerHTML = saleModal(sale); document.body.appendChild(wrap.firstElementChild);
  const overlay = document.getElementById('saleModalOverlay');
  const close = ()=>overlay.remove();
  overlay.addEventListener('click', e=>{ if(e.target===overlay) close(); });
  document.getElementById('closeSaleModal').addEventListener('click', close);
  document.getElementById('closeSaleModal2').addEventListener('click', close);
  document.getElementById('printSaleBtn').addEventListener('click', ()=>doPrint(sale));
}

function completeSaleHandler(){
  const subtotal = state.cart.reduce((a,it)=>a + it.sellPrice*it.qty, 0);
  let discount = Number(state.cartDiscount)||0;
  if(state.cartDiscountType==='percent') discount = subtotal * (discount/100);
  discount = Math.min(discount, subtotal);
  const taxable = subtotal - discount;
  const tax = taxable * ((Number(state.settings.taxPercent)||0)/100);
  const total = taxable + tax;
  const isCard = state.paymentMethod === 'card';
  const cash = isCard ? total : (Number(state.cashReceived)||0);
  if(!isCard && cash < total){ toast('Cash received is less than total','bad'); return; }

  // stock validation
  for(const it of state.cart){
    const p = state.products.find(x=>x.id===it.productId);
    if(!p || p.stock < it.qty){ toast(`Not enough stock for ${it.name}`, 'bad'); return; }
  }

  const invoiceNo = state.settings.invoicePrefix + state.settings.invoiceCounter;
  const sale = {
    id: uid('s_'), invoiceNo, date: Date.now(),
    items: state.cart.map(it=>({productId:it.productId, name:it.name, qty:it.qty, sellPrice:it.sellPrice, buyPrice:it.buyPrice})),
    subtotal, discount, tax, total, cash, balance: isCard ? 0 : cash-total,
    paymentMethod: state.paymentMethod,
    cashierName: state.role==='staff' ? state.currentCashierName : state.settings.cashierName
  };
  // deduct stock
  state.cart.forEach(it=>{ const p = state.products.find(x=>x.id===it.productId); p.stock -= it.qty; });
  state.sales.push(sale);
  state.settings.invoiceCounter += 1;
  persist('products'); persist('sales'); persist('settings');

  state.cart = []; state.cashReceived=''; state.cartDiscount=0; state.paymentMethod='cash';
  renderPage();
  toast(`Sale ${invoiceNo} completed`);
  openSaleModal(sale);
}
